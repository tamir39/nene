name: nene_app
description: Nene mobile banking course project foundation.
publish_to: none
version: 1.0.3+4

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  geolocator: 14.1.2
  google_mlkit_face_detection: 1.0.3
  http: 1.6.0
  http_parser: 4.1.2
  image_picker: 1.2.4
  latlong2: 0.9.1
  supabase_flutter: 2.18.3
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Be Vietnam Pro (SIL OFL 1.1, see assets/fonts/BeVietnamPro-OFL.txt):
  # bundled so Vietnamese diacritics render without a network font fetch.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
