# Local development only. Generated with Supabase CLI 2.121.0, then scoped to Nene.
# Hosted project configuration requires a separate, explicit setup decision.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "nene-local"

[api]
enabled = true
port = 54321
# Banking data is deliberately absent from both exposure and search paths.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# All development email stays inside the local test inbox.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# No web frontend or email-link mobile route is implemented by this foundation.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
# CLI maps this switch to the email provider. Keep it enabled for provisioned
# users to sign in; auth.enable_signup=false above blocks public registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# Session MFA is not a substitute for the pending transaction-bound 2FA design.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# There is one NestJS backend; no parallel Edge Functions backend.
[edge_runtime]
enabled = false

[analytics]
enabled = false
